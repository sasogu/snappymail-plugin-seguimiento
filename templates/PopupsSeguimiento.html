<div class="seguimiento-panel">
    <div class="modal-header">
        <button type="button" class="close" data-bind="click: close" aria-label="Cerrar">×</button>
        <h2>Seguimiento del correo</h2>
        <p class="seguimiento-subtitle">Lo que tienes que hacer y las respuestas que esperas.</p>
    </div>
    <div class="modal-body">
        <div class="seguimiento-summary">
            <span>Cuenta: <strong data-bind="text: account"></strong></span>
            <span><strong data-bind="text: activeCount"></strong> activos · <strong data-bind="text: dueCount"></strong> para revisar</span>
        </div>
        <p class="alert alert-error" role="alert" data-bind="visible: error, text: error"></p>
        <p class="alert alert-success" role="status" data-bind="visible: notice, text: notice"></p>
        <section class="seguimiento-editor" data-bind="visible: editing">
            <h3 data-bind="text: subject"></h3>
            <p class="seguimiento-subtitle" data-bind="text: sender"></p>
            <div class="seguimiento-fields">
                <label>Estado
                    <select data-bind="value: state, disable: busy">
                        <option value="responder">Tengo que responder</option>
                        <option value="esperar">Espero respuesta</option>
                        <option value="resuelto">Resuelto</option>
                    </select>
                </label>
                <label>Fecha de revisión
                    <input type="date" data-bind="value: due, disable: busy">
                </label>
            </div>
            <label>Próxima acción o nota
                <textarea rows="2" maxlength="2000" placeholder="Por ejemplo: reclamar la confirmación de fechas" data-bind="value: note, disable: busy"></textarea>
            </label>
            <button type="button" class="btn btn-primary" data-bind="click: save, disable: busy">Guardar seguimiento</button>
            <button type="button" class="btn" data-bind="click: remove, disable: busy">Quitar seguimiento</button>
        </section>
        <div class="seguimiento-filters">
            <label>Mostrar
                <select data-bind="value: filter">
                    <option value="activos">Todos los activos</option>
                    <option value="vencidos">Para revisar hoy o vencidos</option>
                    <option value="responder">Por responder</option>
                    <option value="esperar">Esperando respuesta</option>
                    <option value="resuelto">Resueltos</option>
                    <option value="todos">Todos, incluidos resueltos</option>
                </select>
            </label>
            <button type="button" class="btn" data-bind="click: load, disable: busy">Actualizar</button>
        </div>
        <p class="seguimiento-empty" data-bind="visible: !visibleItems().length &amp;&amp; !busy()">No hay seguimientos en esta vista. Abre un mensaje y pulsa «Seguimiento» para añadirlo.</p>
        <div class="seguimiento-items" data-bind="foreach: visibleItems">
            <article class="seguimiento-item" data-bind="css: { 'seguimiento-due': $root.isDue($data) }">
                <div class="seguimiento-item-meta">
                    <span class="seguimiento-badge" data-bind="text: $root.label($data)"></span>
                    <span data-bind="text: $root.formattedDate($data)"></span>
                    <strong data-bind="visible: $root.isDue($data)">Revisar</strong>
                </div>
                <h3 data-bind="text: subject || '(Sin asunto)'"></h3>
                <p class="seguimiento-subtitle" data-bind="text: sender"></p>
                <p class="seguimiento-note" data-bind="text: note, visible: note"></p>
                <div class="seguimiento-actions">
                    <button type="button" class="btn" data-bind="click: $root.editItem, disable: $root.busy">Editar</button>
                    <button type="button" class="btn seguimiento-remove" data-bind="click: $root.removeItem, disable: $root.busy">Quitar seguimiento</button>
                    <button type="button" class="btn" data-bind="click: $root.openItem, disable: $root.busy">Abrir correo</button>
                </div>
            </article>
        </div>
    </div>
    <div class="modal-footer">
        <span class="seguimiento-footer-note">Las fechas indican cuándo revisar. No se envían avisos externos.</span>
        <button type="button" class="btn" data-bind="click: close">Cerrar</button>
    </div>
</div>
